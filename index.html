<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Certificate Verification</title>
  </head>
  <body>
    <!-- Mengambilan Data Eksternal -->
    <script src="js/certification_database.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/jay-wasfound/Certificate-Verification-AIDA-Consultant/js/certification_database.js"></script>

    <!-- Widget Container -->
    <div id="cert-checker-widget">
      <div class="cert-header">
        <h3>Verifikasi Sertifikat</h3>
        <p>Masukkan ID Sertifikat atau Nama Lengkap untuk mengecek keaslian.</p>
      </div>

      <div class="cert-search-box">
        <input
          type="text"
          id="cert-input"
          placeholder="Contoh: CERT-2026-001 atau Nama Lengkap"
          onkeyup="checkEnter(event)"
        />
        <button onclick="searchCertificate()">Cari</button>
      </div>

      <!-- Area Hasil Pencarian -->
      <div
        id="cert-result"
        class="cert-result-container"
        style="display: none"
      ></div>
    </div>

    <style>
      #cert-checker-widget {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        width: 70%;
        max-width: 100%;
        margin: 0 auto;
        padding: 24px;
        background: #ffffff;
        box-sizing: border-box;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        color: #1a202c;
      }

      .cert-header h3 {
        font-size: clamp(18px, 2vw, 24px);
        margin-top: 0;
      }

      .cert-header p {
        margin: 0 0 16px 0;
        font-size: 0.875rem;
        color: #64748b;
      }

      .cert-search-box {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }

      .cert-search-box input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .cert-search-box input:focus {
        border-color: #0f172a;
      }

      .cert-search-box button {
        padding: 10px 18px;
        background-color: #0f172a;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .cert-search-box button:hover {
        background-color: #334155;
      }

      /* Status Cards */
      .cert-card {
        padding: clamp(16px, 2vw, 24px);
        border-radius: 8px;
        font-size: clamp(14px, 1.2vw, 16px);
        line-height: 1.6;
      }

      .cert-card.success {
        background-color: #f0fdf4;
        border: 1px solid #bbf7d0;
      }

      .cert-card.error {
        background-color: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
      }

      .cert-badge {
        display: inline-block;
        padding: 2px 8px;
        background-color: #22c55e;
        color: white;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .cert-detail-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        text-align: right;
        padding: 8px 0;
        width: 100%;
        box-sizing: border-box;
        border-bottom: 1px dashed #e2e8f0;
      }

      .cert-detail-row:last-child {
        border-bottom: none;
      }

      .cert-label {
        color: #64748b;
      }

      .cert-value {
        font-weight: 600;
        color: #0f172a;
      }
    </style>

    <!-- Logika & Database Sertifikat (JavaScript) -->
    <script>
      function searchCertificate() {
        const rawInput = document.getElementById("cert-input").value.trim();
        const inputVal = rawInput.toUpperCase();
        const resultContainer = document.getElementById("cert-result");

        if (!rawInput) {
          resultContainer.style.display = "block";
          resultContainer.innerHTML = `
        <div class="cert-card error">
          Mohon masukkan ID Sertifikat atau Nama Lengkap terlebih dahulu.
        </div>`;
          return;
        }

        // Cek apakah input berupa kata tunggal (bukan ID dan bukan nama lengkap)
        const words = rawInput.split(/\s+/);
        const isSingleWord = words.length === 1;

        // Pencocokan:
        // 1. Matched ID jika persis sama
        // 2. Matched Nama JIKA input terdiri dari minimal 2 kata DAN cocok persis dengan nama di database
        const match = certificatesDatabase.find((cert) => {
          const isIdMatch = cert.id && cert.id.toUpperCase() === inputVal;
          const isFullNameMatch =
            cert.name && !isSingleWord && cert.name.toUpperCase() === inputVal;
          return isIdMatch || isFullNameMatch;
        });

        resultContainer.style.display = "block";

        if (match) {
          resultContainer.innerHTML = `
        <div class="cert-card success">
          <span class="cert-badge">✓ SERTIFIKAT VALID</span>
          <div style="margin-top: 8px;">
            <div class="cert-detail-row">
              <span class="cert-label">No. Sertifikat:</span>
              <span class="cert-value">${match.id}</span>
            </div>
            <div class="cert-detail-row">
              <span class="cert-label">Nama Penerima:</span>
              <span class="cert-value">${match.name}</span>
            </div>
            <div class="cert-detail-row">
              <span class="cert-label">Program/Pelatihan:</span>
              <span class="cert-value">${match.course}</span>
            </div>
            <div class="cert-detail-row">
              <span class="cert-label">Tanggal Terbit:</span>
              <span class="cert-value">${match.date}</span>
            </div>
          </div>
        </div>
      `;
        } else {
          let errorMessage = `✕ Data <strong>"${rawInput}"</strong> tidak ditemukan. Pastikan memasukkan ID atau Nama Lengkap dengan benar.`;

          // Beri peringatan khusus jika pengguna hanya memasukkan 1 kata (nama depan/panggilan saja)
          if (isSingleWord && !rawInput.toUpperCase().startsWith("CERT")) {
            errorMessage = `✕ Mohon ketik <strong>Nama Lengkap</strong> (minimal 2 kata), bukan hanya nama panggilan.`;
          }

          resultContainer.innerHTML = `
        <div class="cert-card error">
          ${errorMessage}
        </div>
      `;
        }
      }

      function checkEnter(event) {
        if (event.key === "Enter") {
          searchCertificate();
        }
      }
    </script>
  </body>
</html>
